<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>JARVIS • Personal AI</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="orb">J</div>
      <div><h1>JARVIS</h1><p>PERSONAL AI ASSISTANT</p></div>
      <span class="status">● READY</span>
    </header>
    <section class="hero">
      <div class="rings"><span>J</span></div>
      <h2>At your service, Sunny.</h2>
      <p>Hindi + English · Voice enabled</p>
    </section>
    <section id="messages" class="messages" aria-live="polite">
      <article class="bubble bot"><small>JARVIS</small><p>Namaste Sunny! Main JARVIS hoon. Aaj kya help karun?</p></article>
    </section>
    <div class="controls">
      <label class="sr-only" for="voice">Assistant voice</label>
      <select id="voice"><option>Female</option><option>Male</option></select>
      <button id="mic" class="round" title="Speak">🎙️</button>
      <input id="prompt" autocomplete="off" placeholder="Message JARVIS…" />
      <button id="send" class="send">➤</button>
    </div>
    <footer>Prototype mode · Connect a secure AI backend for real answers</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
